name: Export Room Schema

# 一次性工具 workflow：手动触发，构建时由 Room KSP 导出 schema JSON 并上传为
# artifact（room-schema）。取回 9.json 回填仓库后本文件可删除。

on:
  workflow_dispatch:

jobs:
  export:
    name: Export Room Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build ThroneCore AAR
        uses: ./.github/actions/throne-core
      - name: Fetch routeprofiles snapshot
        uses: ./.github/actions/routeprofiles
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./gradlew app:assembleOssDebug
      - name: Upload Room Schema
        uses: actions/upload-artifact@v5
        with:
          name: room-schema
          path: app/schemas/
          if-no-files-found: error
          retention-days: 1
