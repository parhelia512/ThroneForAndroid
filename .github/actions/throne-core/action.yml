name: Build ThroneCore AAR
description: >-
  Builds app/libs/ThroneCore.aar from throneproj/Throne at the THRONE_CORE_REF pinned in
  nb4a.properties. The AAR is cached on the resolved commit and the core build script.
runs:
  using: composite
  steps:
    - name: Checkout Throne
      shell: bash
      run: |
        set -euo pipefail
        REF=$(sed -n 's/^THRONE_CORE_REF=//p' nb4a.properties | tr -d '\r[:space:]')
        test -n "$REF"
        THRONE_DIR="$(dirname "$GITHUB_WORKSPACE")/Throne"
        rm -rf "$THRONE_DIR"
        git init -q "$THRONE_DIR"
        git -C "$THRONE_DIR" remote add origin https://github.com/throneproj/Throne
        git -C "$THRONE_DIR" fetch -q --depth 1 origin "$REF"
        git -C "$THRONE_DIR" checkout -q --detach FETCH_HEAD
        {
          echo "THRONE_CORE_REF=$REF"
          echo "THRONE_DIR=$THRONE_DIR"
          echo "THRONE_CORE_SHA=$(git -C "$THRONE_DIR" rev-parse HEAD)"
          echo "THRONE_CORE_SCRIPT_SHA=$(sha256sum "$THRONE_DIR/script/build_android.sh" | cut -d' ' -f1)"
        } >> "$GITHUB_ENV"
    - name: ThroneCore AAR cache
      id: cache
      uses: actions/cache@v5
      with:
        path: app/libs/ThroneCore.aar
        key: throne-core-${{ env.THRONE_CORE_REF }}-${{ env.THRONE_CORE_SHA }}-${{ env.THRONE_CORE_SCRIPT_SHA }}-${{ hashFiles('.github/actions/throne-core/action.yml') }}
    - name: Install Golang
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'
        cache: false
    - name: Go module cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: go-mod-throne-${{ runner.os }}-${{ env.THRONE_CORE_SHA }}
        restore-keys: |
          go-mod-throne-${{ runner.os }}-
    - name: Setup Java
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android NDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
    - name: Install gomobile
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
        go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
    - name: Build ThroneCore AAR
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ env.THRONE_DIR }}
      run: DEST="$GITHUB_WORKSPACE/app/libs" bash script/build_android.sh
    - name: Verify ThroneCore AAR
      shell: bash
      run: |
        set -euo pipefail
        test -s app/libs/ThroneCore.aar
        unzip -p app/libs/ThroneCore.aar classes.jar > "$RUNNER_TEMP/throne-core-classes.jar"
        unzip -l "$RUNNER_TEMP/throne-core-classes.jar" | grep -q 'io/throneproj/mobile/Mobile.class'
        unzip -l "$RUNNER_TEMP/throne-core-classes.jar" | grep -q 'go/Seq.class'
